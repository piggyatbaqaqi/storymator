# big_green_button -- route the big green button to our own software
# instead of letting it type Return into whatever window has focus.
# See docs/big-green-button.md.
#
#   sudo install -m 0644 big_green_button/etc/big-green-button.conf \
#       /etc/keyd/big-green-button.conf
#   sudo keyd.rvaiya reload
#
# keyd takes the exclusive grab on every device it manages, which is
# what keeps the Return out of the keyboard stream.  The k: prefix
# matches the keyboard interface only: 8089:0019 is also a mouse
# (mouse2/js0) and keyd's manual calls mouse management experimental.

[ids]

k:8089:0019

[main]

# Measured: this button always sends KEY_ENTER, scancode 70028 (HID
# page 7, usage 0x28).  kpenter is bound anyway so that a firmware mode
# change or a replacement button cannot quietly start leaking Returns
# into the keyboard stream.
#
# keyd calls the hook once per PHYSICAL press: it drops kernel
# autorepeat (device.c, value == 2) and fires command() only on key
# down.  Holding the button for 1.2 s produces 28 repeat events and
# exactly one hook run.
#
# command() runs as the user running keyd, which is root.  The hook
# hands that straight back -- see Security in docs/big-green-button.md.
#
# The hook lives in /opt rather than /usr/local/bin because every
# ancestor of /usr/local/bin on this machine is root:src mode 0775, and
# a group-writable ancestor lets a non-root user swap the file keyd
# runs as root.

enter   = command(/opt/big-green-button/press)
kpenter = command(/opt/big-green-button/press)

# The "weird keystroke" alternative, deliberately left off.
#
# keyd accepts f24 and the kernel has KEY_F24, but <FK24> is bound to
# the F24 keysym only in xkb's fkeys(basic_13-24) variant, and nothing
# in the default pc layout includes it.  Under this machine's GNOME
# Wayland session the keystroke therefore arrives with no keysym and no
# application can bind it.  Add fkeys(basic_13-24) to the session
# keymap first, then swap these in for the command() lines above.
#
# enter   = f24
# kpenter = f24
