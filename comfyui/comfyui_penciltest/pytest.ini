[pytest]
# importlib mode keeps pytest from prepending directories to sys.path and
# then discovering this pack's own __init__.py as a top-level module
# called "__init__" -- which it would import, pulling in comfy_api and
# defeating the point of penciltest/ being testable without ComfyUI.
addopts = --import-mode=importlib
# Unit tests live beside the module they exercise, as foo_test.py --
# in nodes/ as well as penciltest/, since a thin adapter is still worth
# a test and keeping it next to what it adapts is the same principle.
testpaths = penciltest nodes
python_files = test_*.py *_test.py
