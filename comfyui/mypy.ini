# Type checking for the ComfyUI packs.  Run from THIS directory:
#
#     cd comfyui && mypy comfyui_acme comfyui_penciltest
#
# It lives here, one level above the packs, rather than inside each of
# them, because that is the only place both of their problems go away.
#
# Run from inside a pack, mypy refuses to start at all:
#
#   Source file found twice under different module names:
#   "comfyui_acme.acme.capture" and "acme.capture"
#
# Both readings are real -- the pack root is a package, since ComfyUI
# imports it as one, and `acme/` is a package inside it.  And a base
# inside the pack also breaks `nodes/`, whose modules say
# `from ..acme.report import ...`: the `..` reaches above the base and
# resolves to nothing.
#
# Basing at `comfyui/` answers both.  Every file has exactly one module
# name, `comfyui_acme.acme.capture`, and `..` has somewhere to go.
[mypy]
explicit_package_bases = True
namespace_packages = True
mypy_path =

# Third-party packages without type information.  Listed one by one
# rather than with a blanket ignore_missing_imports, so that a genuinely
# missing stub for something we DO expect to be typed still shows up.
[mypy-cv2.*]
ignore_missing_imports = True

[mypy-comfy_api.*]
ignore_missing_imports = True

[mypy-scipy.*]
ignore_missing_imports = True

# Both packs check clean as of 2026-10-14.  They did not at first: the
# test modules imported their own pack absolutely (`from acme.fit import
# ...`), which runs fine because conftest.py puts the pack root on
# sys.path, but gives mypy a module name the base here cannot resolve.
#
# The fix had to differ by layout, because the two test directories sit
# in different places relative to the package:
#
#   comfyui_acme/acme/*_test.py   are INSIDE the acme package, so
#                                 `from .fit import ...`
#   comfyui_acme/tests/test_*.py  are OUTSIDE it, so
#                                 `from comfyui_acme.acme.fit import ...`
#
# If a third layout appears, that is the question to ask of it: where
# does this file sit relative to the package it is testing?
