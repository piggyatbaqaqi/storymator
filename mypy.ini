# Type checking for everything OUTSIDE comfyui/.
#
#     mypy big_green_button bin data
#
# fixes/ is absent from that list because it holds no .py file at all --
# only the extensionless prune-duplicate-captures -- and naming a
# directory with no modules in it is an error rather than a no-op.
#
# The ComfyUI packs are checked separately, from comfyui/ and against
# comfyui/mypy.ini.  They need a different base directory and that file
# explains why; the short version is that a pack root is itself a
# package, so a base inside one makes every module ambiguous.
#
# The extensionless CLIs in bin/ and fixes/ are NOT picked up by naming
# a directory -- mypy walks for *.py -- so they have to be named:
#
#     mypy bin/measure-ink bin/score-focus ...
#
# and even then they hit the same ambiguity, because bin/ holds both a
# script and its *_test.py.  Left alone for now; see the debt note.

[mypy]
explicit_package_bases = True
namespace_packages = True
mypy_path =

# Third-party packages without type information, listed one at a time
# rather than with a blanket ignore, so a missing stub for something we
# DO expect to be typed still shows up.
[mypy-cv2.*]
ignore_missing_imports = True

[mypy-scipy.*]
ignore_missing_imports = True

# Optional: data/calibration/acme_paper/acme_paper.py publishes the
# punch-geometry dataset through it and degrades quietly without it.
# Not in environment.yml, so not resolvable here.
[mypy-datasets.*]
ignore_missing_imports = True

# bin/measure-ink reaches into the ComfyUI pack deliberately, with a
# sys.path.insert and documented noqa, so bin/measure_ink_test.py
# imports acme.model.  The coupling is real and intended; it is only
# invisible to the checker because the pack lives under a different
# base.  Worth revisiting if bin/ grows more of these.
[mypy-acme.*]
ignore_missing_imports = True

# KNOWN DEBT, 2026-10-14.  big_green_button/, bin/*_test.py and
# data/corpora/ are clean.  Three files are not:
#
#     data/calibration/acme_paper/acme_paper.py          19 errors
#     data/calibration/distortion/v4k_01/make_calibration.py  4
#     data/calibration/distortion/v4k_01/anisotropy_scan.py   1
#
# Unlike comfyui_acme's 21, these are NOT one mechanical class -- they
# are numpy typing: operator, index, slice, dtype, call-overload.  Real
# work, not a sed, so not done as a side effect of adding a config.
# They are left visible rather than silenced per-file, deliberately: a
# count that shows up on every run is harder to forget than a comment.
